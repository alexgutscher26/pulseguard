# SSL/TLS certificate and domain expiry monitoring.
#
# SSL monitor fires when the certificate expires within `warn_days`.
# DOMAIN monitor fires when the domain registration expires within `warn_days`.
#
# Apply with:
#   pulse monitors apply ssl-domain.yml

monitors:
  # ── TLS certificate expiry ───────────────────────────────────────────────────
  - name: example-com-ssl
    type: SSL
    hostname: example.com
    port: 443
    interval: 3600        # check once per hour
    warn_days: 30         # alert when < 30 days remaining
    alerts:
      - default-email
      - slack-ops
    tags:
      - ssl
      - certificates

  - name: api-example-com-ssl
    type: SSL
    hostname: api.example.com
    port: 443
    interval: 3600
    warn_days: 14
    alerts:
      - pagerduty-on-call
    tags:
      - ssl
      - api

  # ── Domain registration expiry ───────────────────────────────────────────────
  - name: example-com-domain
    type: DOMAIN
    hostname: example.com
    interval: 86400       # once per day is sufficient
    warn_days: 60         # alert 60 days before expiry
    alerts:
      - default-email
    tags:
      - domain
      - registration
