name: Release

# Triggers on pushing a semver tag: v1.0.0, v1.2.3-beta.1, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # required to create GitHub Releases and push CHANGELOG

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout full history so git-cliff can read all commits ─────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Set up Bun (to run linting/type checks as a gate) ───────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Derive version from tag ──────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Releasing $TAG"

      # ── Generate CHANGELOG entry for this release using git-cliff ───────────
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        id: notes
        run: |
          # Generate notes for just this tag (between previous tag and HEAD)
          git cliff --latest --strip header --output release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        run: |
          # Insert the new release entry after the [Unreleased] section
          git cliff --output CHANGELOG.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update CHANGELOG for ${{ steps.version.outputs.tag }}" || echo "No changelog changes"
          git push origin HEAD:master

      # ── Build Docker images ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta — web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulseguard-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push — web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta — probe
        id: meta-probe
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulseguard-probe
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push — probe
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/probe/Dockerfile
          push: true
          tags: ${{ steps.meta-probe.outputs.tags }}
          labels: ${{ steps.meta-probe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Package Helm chart ───────────────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.x"

      - name: Package Helm chart
        run: |
          # Bump appVersion in Chart.yaml to match the release tag
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/pulseguard/Chart.yaml
          sed -i "s/^version:.*/version: $VERSION/" helm/pulseguard/Chart.yaml
          # Resolve subchart dependencies (bitnami/postgresql) before packaging
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build helm/pulseguard
          helm package helm/pulseguard --destination helm-artifacts/

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.tag }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            helm-artifacts/*.tgz
          generate_release_notes: false # we use git-cliff, not GitHub's generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
