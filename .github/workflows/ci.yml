name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulseguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulseguard
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pulseguard
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: mock-token
      BETTER_AUTH_SECRET: mock-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Turborepo remote cache (Vercel). Steps fall back to local-only
      # caching when these secrets aren't configured.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Database Client
        run: bun run db:generate

      - name: Push Database Schema
        run: bun run db:push

      - name: Lint
        run: bun run check

      - name: File Naming Conventions
        # Source files must use kebab-case (see scripts/check-filenames.js).
        run: bun run check-names

      - name: Type Check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Storybook Build
        # Verifies the component library compiles under Storybook.
        run: bun run build-storybook

      - name: Size Limit (default: web)
        # Prevents bundle size regressions. Only apps that define a `size-limit`
        # script are measured (currently only apps/web).
        run: bun run check-size

      - name: Depcheck
        # Catches unused / missing dependencies. npm_scripts are resolved per
        # workspace; apps/native (Expo/Metro) and apps/worker (huge Cloudflare
        # monolith + workerd bindings) are intentionally excluded.
        run: bun run check-deps

      - name: Start Next.js Production Server
        run: bun --cwd apps/web run start &

      - name: Wait for Server to be Responsive
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000 > /dev/null && break
            echo "Waiting for Next.js server to start on port 3000..."
            sleep 2
          done

      - name: Run Lighthouse Performance CI Audits
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/login
            http://localhost:3000/signup
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate PR commit messages
        run: bunx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.x"

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: helm dependency build helm/pulseguard

      - name: Lint chart
        run: helm lint helm/pulseguard

      - name: Render default values
        run: helm template pulseguard helm/pulseguard --namespace pulseguard

      - name: Render external database + probe
        run: >
          helm template pulseguard helm/pulseguard --namespace pulseguard
          --set postgresql.enabled=false
          --set secrets.databaseUrl=postgresql://u:p@db.example.com:5432/pulseguard
          --set secrets.directUrl=postgresql://u:p@db.example.com:5432/pulseguard
          --set probe.enabled=true
          --set metrics.enabled=true
          --set metrics.serviceMonitor.enabled=true
          --set networkPolicy.enabled=true
