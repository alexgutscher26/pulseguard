name: Preview

# Deploys every PR to a unique Cloudflare Workers preview URL and comments
# the link on the PR. The preview worker is deleted when the PR is closed.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account ID (used by wrangler)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/steadystack
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/steadystack
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock-token
  BETTER_AUTH_SECRET: mock-auth-secret
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (OpenNext)
        run: bunx turbo build --filter=web

      - name: Deploy preview to Cloudflare Workers
        id: deploy
        run: |
          WORKER_NAME="steadystack-web-pr-${{ github.event.pull_request.number }}"
          cd apps/web
          OUTPUT=$(bunx wrangler deploy --name "$WORKER_NAME" 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -n 1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract preview URL from wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **Preview deployment ready**

            Preview URL: ${{ steps.deploy.outputs.url }}
            Worker: `${{ steps.deploy.outputs.worker }}`

            The preview is updated on every push to this PR and removed when
            the PR is closed.

  cleanup:
    name: Remove preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Delete preview worker
        run: |
          cd apps/web
          bunx wrangler delete --name "steadystack-web-pr-${{ github.event.pull_request.number }}" \
            || echo "Preview worker not found; nothing to delete"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🧹 **Preview deployment removed**

            The preview worker for PR #${{ github.event.pull_request.number }}
            has been cleaned up.
