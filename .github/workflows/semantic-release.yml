name: Semantic Release

# Automatically derives the next semver version from conventional commits on
# master, regenerates CHANGELOG.md with git-cliff, and creates a version tag.
# The tag triggers the Release workflow (Docker images, Helm chart, GitHub
# Release). Only feat/fix/perf/breaking commits produce a release.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Check for release-worthy commits
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COUNT=$(git log "$LAST_TAG..HEAD" --pretty=%s | grep -cE '^(feat|fix|perf)(\(.*\))?(!)?:' || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Release-worthy commits since $LAST_TAG: $COUNT"

      - name: Compute next version
        id: version
        if: steps.commits.outputs.count != '0'
        run: |
          NEXT_VERSION=$(git cliff --bumped-version | tr -d '[:space:]')
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Update CHANGELOG and create tag
        if: steps.version.outputs.version != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git cliff --output CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION" || echo "No changelog changes"
          # Push the tag before the changelog commit so any re-triggered run
          # (from the commit push below) already sees the new tag and cannot
          # bump the version a second time.
          git tag "v$VERSION"
          git push origin "v$VERSION"
          git push origin HEAD:master
