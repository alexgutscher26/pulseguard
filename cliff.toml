# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to SteadyStack are documented here.\n
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
  {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/getsteadystack/SteadyStack/commit/{{ commit.id }}))\
  {% if commit.breaking %} ⚠️ **BREAKING**{% endif %}\
{% endfor %}
{% endfor %}\n
"""

footer = """
{% for release in releases %}\
  {% if release.version %}\
    {% if release.previous.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: \
  https://github.com/getsteadystack/SteadyStack/compare/{{ release.previous.version }}...{{ release.version }}
    {% endif %}\
  {% else %}\
[Unreleased]: https://github.com/getsteadystack/SteadyStack/compare/{{ release.previous.version }}...HEAD
  {% endif %}\
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Map commit types to changelog sections
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📖 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 6 -->🔧 Chores" },
  { message = "^ci", group = "<!-- 7 -->⚙️ CI/CD" },
  { body = ".*security", group = "<!-- 8 -->🔒 Security" },
]

# Ignore dependency bump commits
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
