# Default values for pulseguard.
# Override by passing --values my-values.yaml to helm install.

# ── Global ───────────────────────────────────────────────────────────────────
global:
  # Image pull secret name (if using a private registry)
  imagePullSecrets: []
  # Override the name of all resources
  nameOverride: ""
  fullnameOverride: ""

# ── Web Dashboard (Next.js) ───────────────────────────────────────────────────
web:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/alexgutscher26/pulseguard-web
    pullPolicy: IfNotPresent
    tag: "" # defaults to .Chart.AppVersion

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  # Health probes
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Private Probe ─────────────────────────────────────────────────────────────
probe:
  enabled: false
  replicaCount: 1

  image:
    repository: ghcr.io/alexgutscher26/pulseguard-probe
    pullPolicy: IfNotPresent
    tag: ""

  config:
    # URL of your PulseGuard Worker (Cloudflare)
    workerUrl: "https://worker.yourdomain.com"
    region: "k8s-cluster"
    probeId: "" # auto-generated if empty

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx" # or "traefik", "gce", etc.
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: pulseguard.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pulseguard-tls
      hosts:
        - pulseguard.yourdomain.com

# ── Application Secrets ───────────────────────────────────────────────────────
# All values here are written into a Kubernetes Secret.
# For production, prefer an external secret manager (e.g. ExternalSecrets, Vault).
secrets:
  # Required
  databaseUrl: "" # postgresql://user:pass@host:5432/db
  directUrl: "" # same or direct (non-pooled) connection
  betterAuthSecret: "" # min 32 random chars
  betterAuthUrl: "" # https://pulseguard.yourdomain.com
  nextPublicAppUrl: "" # same as betterAuthUrl
  corsOrigin: "" # same as betterAuthUrl

  # Optional — leave empty to disable
  resendApiKey: ""
  openaiApiKey: ""
  upstashRedisRestUrl: ""
  upstashRedisRestToken: ""
  slackClientId: ""
  slackClientSecret: ""
  slackSigningSecret: ""
  googleClientId: ""
  googleClientSecret: ""
  probeSecret: "" # shared secret between probe and worker

# ── PostgreSQL (Bitnami subchart) ─────────────────────────────────────────────
postgresql:
  enabled: true # set false to use an external database
  auth:
    username: pulseguard
    password: changeme # override in production
    database: pulseguard
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "" # leave empty for cluster default
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  metrics:
    enabled: false # set true to expose Prometheus metrics

# External database — used when postgresql.enabled=false
externalDatabase:
  host: ""
  port: 5432
  database: pulseguard
  username: pulseguard
  # Reference an existing Kubernetes Secret instead of hardcoding:
  existingSecret: ""
  existingSecretPasswordKey: "password"

# ── Redis (Bitnami subchart) ──────────────────────────────────────────────────
redis:
  enabled: true # set false to use Upstash or external Redis
  auth:
    enabled: true
    password: changeme # override in production
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# External Redis — used when redis.enabled=false
externalRedis:
  # If using Upstash, leave host empty and set secrets.upstashRedisRestUrl
  host: ""
  port: 6379
  existingSecret: ""
  existingSecretPasswordKey: "password"

# ── ServiceAccount ────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# ── Pod Disruption Budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false # set true to restrict pod-to-pod traffic

# ── Monitoring (Prometheus ServiceMonitor) ────────────────────────────────────
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
