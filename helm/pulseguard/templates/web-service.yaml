{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulseguard.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pulseguard.web.selectorLabels" . | nindent 4 }}
{{- end }}
