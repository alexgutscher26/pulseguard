apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulseguard.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  DIRECT_URL: {{ .Values.secrets.directUrl | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  BETTER_AUTH_URL: {{ .Values.secrets.betterAuthUrl | quote }}
  NEXT_PUBLIC_APP_URL: {{ .Values.secrets.nextPublicAppUrl | quote }}
  CORS_ORIGIN: {{ .Values.secrets.corsOrigin | quote }}
  {{- if .Values.secrets.resendApiKey }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.upstashRedisRestUrl }}
  UPSTASH_REDIS_REST_URL: {{ .Values.secrets.upstashRedisRestUrl | quote }}
  UPSTASH_REDIS_REST_TOKEN: {{ .Values.secrets.upstashRedisRestToken | quote }}
  {{- end }}
  {{- if .Values.secrets.slackClientId }}
  SLACK_CLIENT_ID: {{ .Values.secrets.slackClientId | quote }}
  SLACK_CLIENT_SECRET: {{ .Values.secrets.slackClientSecret | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.secrets.slackSigningSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.probeSecret }}
  PROBE_SECRET: {{ .Values.secrets.probeSecret | quote }}
  {{- end }}
  NODE_ENV: "production"
