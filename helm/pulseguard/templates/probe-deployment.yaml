{{- if .Values.probe.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulseguard.fullname" . }}-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe
spec:
  replicas: {{ .Values.probe.replicaCount }}
  selector:
    matchLabels:
      {{- include "pulseguard.probe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart when secrets change
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "pulseguard.probe.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pulseguard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.probe.podSecurityContext | nindent 8 }}
      containers:
        - name: probe
          image: "{{ .Values.probe.image.repository }}:{{ include "pulseguard.probe.imageTag" . }}"
          imagePullPolicy: {{ .Values.probe.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.probe.securityContext | nindent 12 }}
          env:
            - name: PULSEGUARD_API_URL
              value: {{ .Values.probe.config.apiUrl | quote }}
            - name: PULSEGUARD_PROBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulseguard.fullname" . }}-secrets
                  key: PULSEGUARD_PROBE_TOKEN
                  optional: true
            - name: PROBE_REGION
              value: {{ .Values.probe.config.region | quote }}
          resources:
            {{- toYaml .Values.probe.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
