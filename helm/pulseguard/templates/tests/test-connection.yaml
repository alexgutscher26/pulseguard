{{- if .Values.web.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pulseguard.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - curl
        - -sf
        - --retry
        - "5"
        - --retry-connrefused
        - http://{{ include "pulseguard.fullname" . }}-web:{{ .Values.web.service.port }}/api/health
  restartPolicy: Never
{{- end }}
