apiVersion: v2
name: steadystack
description: Edge-native monitoring platform — Helm chart for Kubernetes self-hosted deployment
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - monitoring
  - uptime
  - status-page
  - observability
home: https://github.com/getsteadystack/SteadyStack
sources:
  - https://github.com/getsteadystack/SteadyStack
maintainers:
  - name: SteadyStack Contributors
    url: https://github.com/getsteadystack/SteadyStack
dependencies:
  # Bundled PostgreSQL for a batteries-included install.
  # Set postgresql.enabled=false to use an external database instead.
  - name: postgresql
    version: "16.6.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
