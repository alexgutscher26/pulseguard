<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="ss-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="ss-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON (Left Side) -->
  <g transform="translate(2, 0)">
    <!-- Bottom Stack -->
    <path d="M8 32.5L24 40.5L40 32.5L36 29L24 35L12 29L8 32.5Z" fill="url(#ss-logo-grad)" fill-opacity="0.4" />
    <!-- Middle Stack -->
    <path d="M8 24.5L24 32.5L40 24.5L36 21L24 27L12 21L8 24.5Z" fill="url(#ss-logo-grad)" fill-opacity="0.75" />
    <!-- Top Stack -->
    <path d="M24 7.5L40 15.5L24 23.5L8 15.5L24 7.5Z" fill="#0B132B" stroke="url(#ss-logo-grad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#ss-logo-glow)"/>
    <!-- Waveform Pulse -->
    <path d="M14 15.5H19L22 10.5L24 20.5L26 12.5L28 17.5L30 15.5H34" stroke="#10B981" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="20.5" r="1.5" fill="#34D399" />
  </g>

  <!-- LOGO TEXT (Right Side) -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#FFFFFF">Steady</tspan>
    <tspan fill="url(#ss-logo-grad)">Stack</tspan>
  </text>
</svg>
