  <path d="M8 24.5L24 32.5L40 24.5L36 21L24 27L12 21L8 24.5Z" fill="url(#ss-teal-grad)" fill-opacity="0.75" />

  <!-- Top Stack Layer 1 (Hex/Isometric Cap) -->
  <path d="M24 7.5L40 15.5L24 23.5L8 15.5L24 7.5Z" fill="#0B132B" stroke="url(#ss-teal-grad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#ss-shadow)"/>
  
  <!-- Precision Telemetry Waveform / Pulse in Center -->
  <path d="M14 15.5H19L22 10.5L24 20.5L26 12.5L28 17.5L30 15.5H34" stroke="#10B981" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Edge Node Signal Dot -->
